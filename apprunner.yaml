version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - echo "Starting build process..."
      - npx pnpm install || echo "pnpm install failed with exit code $?"
      - npx pnpm run db:generate || echo "pnpm run db:generate failed with exit code $?"
      - npx pnpm run build || echo "pnpm run build failed with exit code $?"
      - npx pnpm run db:deploy || echo "pnpm run db:deploy failed with exit code $?"
run:
  command: npm run start
  network:
    port: 3001
    env: APP_PORT
  secrets:
    # From Secrets Manager
    - name: APP_DATABASE_URL
      value-from: "arn:aws:secretsmanager:us-east-1:529088254775:secret:sabonah/database:url::"
    - name: APP_AWS_ACCESS_KEY
      value-from: "arn:aws:secretsmanager:us-east-1:529088254775:secret:sabonah/aws-credentials:access_key::"
    - name: APP_AWS_SECRET_KEY
      value-from: "arn:aws:secretsmanager:us-east-1:529088254775:secret:sabonah/aws-credentials:secret_key::"
    - name: APP_TWILIO_AUTH_TOKEN
      value-from: "arn:aws:secretsmanager:us-east-1:529088254775:secret:sabonah/twilio:auth_token::"
    - name: APP_FIREBASE_PRIVATE_KEY
      value-from: "arn:aws:secretsmanager:us-east-1:529088254775:secret:sabonah/firebase:private_key::"
    - name: APP_FIREBASE_PRIVATE_KEY_DEV
      value-from: "arn:aws:secretsmanager:us-east-1:529088254775:secret:sabonah/firebase:private_key_dev::"
    # From Parameter Store
    - name: APP_ENV
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/app/env"
    - name: APP_PORT
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/app/port"
    - name: APP_DEBUG
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/app/debug"
    - name: APP_LOG_LEVEL
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/app/log-level"
    - name: APP_TOKEN_EXPIRATION
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/app/token-expiration"
    - name: APP_REDIS_HOST
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/redis/host"
    - name: APP_REDIS_PORT
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/redis/port"
    - name: APP_AWS_REGION
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/aws/region"
    - name: APP_AWS_BUCKET
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/aws/bucket"
    - name: APP_AWS_BUCKET_BASE_URL
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/aws/bucket-base-url"
    - name: APP_AWS_STS_ROLE_ARN
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/aws/sts-role-arn"
    - name: APP_AWS_QUEUE_URL
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/aws/queue-url"
    - name: APP_AWS_SES_FROM_EMAIL
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/aws/ses-from-email"
    - name: APP_TWILIO_ACCOUNT_SID
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/twilio/account-sid"
    - name: APP_VERIFY_SERVICE_SID
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/twilio/verify-service-sid"
    - name: APP_GOOGLE_OAUTH_ENDPOINT
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/oauth/google-endpoint"
    - name: APP_APPLE_OAUTH_ENDPOINT
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/oauth/apple-endpoint"
    - name: APP_FIREBASE_CLIENT_EMAIL
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/firebase/client-email"
    - name: APP_FIREBASE_CLIENT_EMAIL_DEV
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/firebase/client-email-dev"
    - name: APP_FIREBASE_PROJECT_ID
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/firebase/project-id"
    - name: APP_FIREBASE_PROJECT_ID_DEV
      value-from: "arn:aws:ssm:us-east-1:529088254775:parameter/sabonah/firebase/project-id-dev"