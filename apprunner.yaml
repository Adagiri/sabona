version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      # Install pnpm first
      - npm install -g pnpm
    build:
      - pnpm install
      - pnpm run db:generate
      - pnpm run build
      - pnpm run db:deploy
run:
  runtime-version: 22
  command: npm run start
  network:
    port: 3001
    env: APP_PORT
  env:
    # From Secrets Manager
    - name: APP_DATABASE_URL
      value: "{{resolve:secretsmanager:sabonah/database:SecretString:url}}"
    - name: APP_AWS_ACCESS_KEY
      value: "{{resolve:secretsmanager:sabonah/aws-credentials:SecretString:access_key}}"
    - name: APP_AWS_SECRET_KEY
      value: "{{resolve:secretsmanager:sabonah/aws-credentials:SecretString:secret_key}}"
    - name: APP_TWILIO_AUTH_TOKEN
      value: "{{resolve:secretsmanager:sabonah/twilio:SecretString:auth_token}}"
    - name: APP_FIREBASE_PRIVATE_KEY
      value: "{{resolve:secretsmanager:sabonah/firebase:SecretString:private_key}}"
    - name: APP_FIREBASE_PRIVATE_KEY_DEV
      value: "{{resolve:secretsmanager:sabonah/firebase:SecretString:private_key_dev}}"
    
    # From Parameter Store - App Configuration
    - name: APP_ENV
      value: "{{resolve:ssm:/sabonah/app/env}}"
    - name: APP_PORT
      value: "{{resolve:ssm:/sabonah/app/port}}"
    - name: APP_DEBUG
      value: "{{resolve:ssm:/sabonah/app/debug}}"
    - name: APP_LOG_LEVEL
      value: "{{resolve:ssm:/sabonah/app/log-level}}"
    - name: APP_TOKEN_EXPIRATION
      value: "{{resolve:ssm:/sabonah/app/token-expiration}}"
    
    # From Parameter Store - Redis
    - name: APP_REDIS_HOST
      value: "{{resolve:ssm:/sabonah/redis/host}}"
    - name: APP_REDIS_PORT
      value: "{{resolve:ssm:/sabonah/redis/port}}"
    
    # From Parameter Store - AWS Configuration
    - name: APP_AWS_REGION
      value: "{{resolve:ssm:/sabonah/aws/region}}"
    - name: APP_AWS_BUCKET
      value: "{{resolve:ssm:/sabonah/aws/bucket}}"
    - name: APP_AWS_BUCKET_BASE_URL
      value: "{{resolve:ssm:/sabonah/aws/bucket-base-url}}"
    - name: APP_AWS_STS_ROLE_ARN
      value: "{{resolve:ssm:/sabonah/aws/sts-role-arn}}"
    - name: APP_AWS_QUEUE_URL
      value: "{{resolve:ssm:/sabonah/aws/queue-url}}"
    - name: APP_AWS_SES_FROM_EMAIL
      value: "{{resolve:ssm:/sabonah/aws/ses-from-email}}"
    
    # From Parameter Store - Twilio
    - name: APP_TWILIO_ACCOUNT_SID
      value: "{{resolve:ssm:/sabonah/twilio/account-sid}}"
    - name: APP_VERIFY_SERVICE_SID
      value: "{{resolve:ssm:/sabonah/twilio/verify-service-sid}}"
    
    # From Parameter Store - OAuth
    - name: APP_GOOGLE_OAUTH_ENDPOINT
      value: "{{resolve:ssm:/sabonah/oauth/google-endpoint}}"
    - name: APP_APPLE_OAUTH_ENDPOINT
      value: "{{resolve:ssm:/sabonah/oauth/apple-endpoint}}"
    
    # From Parameter Store - Firebase
    - name: APP_FIREBASE_CLIENT_EMAIL
      value: "{{resolve:ssm:/sabonah/firebase/client-email}}"
    - name: APP_FIREBASE_CLIENT_EMAIL_DEV
      value: "{{resolve:ssm:/sabonah/firebase/client-email-dev}}"
    - name: APP_FIREBASE_PROJECT_ID
      value: "{{resolve:ssm:/sabonah/firebase/project-id}}"
    - name: APP_FIREBASE_PROJECT_ID_DEV
      value: "{{resolve:ssm:/sabonah/firebase/project-id-dev}}"