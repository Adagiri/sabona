services:
  db:
    image: 'docker.io/library/postgres:13'
    container_name: sabonah.db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=sabonah_postgres
      - POSTGRES_PASSWORD=click123
      - POSTGRES_DB=sabonah_db
    volumes:
      - 'sabonah_postgres_data:/var/lib/postgresql/data'

  redis:
    container_name: sabonah.redis
    image: 'docker.io/library/redis:7'
    ports:
      - 6379:6379
    volumes:
      - 'sabonah_redis_data:/data'

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sabonah.pgadmin
    ports:
      - 8080:80
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@sabonah.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sabonah.redis-gui
    ports:
      - 8081:8081
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      - redis

volumes:
  sabonah_postgres_data:
    external: true
  sabonah_redis_data:
    external: true
  pgadmin_data: