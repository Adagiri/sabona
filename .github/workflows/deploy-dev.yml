name: Deploy to ECS DEV

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.ref == 'refs/heads/dev' && 'dev') }}
    steps:
      # see: https://github.com/aws-actions/configure-aws-credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
  
      # see: https://github.com/aws-actions/amazon-ecr-login
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: Checkout code
        uses: actions/checkout@v2 
      
      - name: Creation of .env file
        run: |
          echo AWS_REGION=${{ vars.AWS_REGION }} >> .env
          echo APP_DATABASE_URL=${{ vars.APP_DATABASE_URL_DEV }} >> .env
          echo APP_DEBUG=${{ vars.APP_DEBUG }} >> .env
          echo APP_ENV=${{ vars.APP_ENV_DEV }} >> .env
          echo APP_REDIS_HOST=${{ vars.APP_REDIS_HOST_DEV }} >> .env
          echo APP_REDIS_PORT=${{ vars.APP_REDIS_PORT }} >> .env
          echo APP_TOKEN_EXPIRATION=${{ vars.APP_TOKEN_EXPIRATION }} >> .env
          echo APP_TWILIO_ACCOUNT_SID=${{ vars.APP_TWILIO_ACCOUNT_SID }} >> .env
          echo APP_TWILIO_AUTH_TOKEN=${{ vars.APP_TWILIO_AUTH_TOKEN }} >> .env
          echo APP_VERIFY_SERVICE_SID=${{ vars.APP_VERIFY_SERVICE_SID }} >> .env
          echo APP_PORT=${{ vars.APP_PORT }} >> .env
      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_DEV }}
          IMAGE_TAG: latest
        run: |
          cat .env
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster ${{ vars.ECS_CLUSTER_DEV }} --service ${{ vars.ECS_SERVICE_DEV }} --force-new-deployment
  
      - name: Log out of Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
